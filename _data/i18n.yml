# Every user-visible string on the site. Templates contain no copy.
#
# Adding a language: append an entry to `locales`, add a top-level block with
# the same keys as `es`, create the stub page, and add an OG card SVG. No
# template changes are required — head.html, lang-switch.html and the Rakefile
# all derive their behaviour from this list.

locales:
  - code: es
    path: /
    label: ES
    html_lang: es-AR
    og_locale: es_AR
    default: true
  - code: en
    path: /en/
    label: EN
    html_lang: en
    og_locale: en_US

contact_email: hola@cleohmedia.com

es:
  page_title: "Cleoh · Inteligencia de medios"
  meta_description: >-
    Cleoh captura lo que se publica en medios, redes y sitios públicos, lo
    convierte en inteligencia y lo distribuye a los equipos de comunicación
    que tienen que actuar.

  nav:
    aria_label: Navegación principal
    layers: Cómo funciona
    audience: Para quién
    contact: Contacto

  hero:
    badge: Plataforma de inteligencia de medios
    headline_lead: Demasiada información.
    headline_highlight: Muy poca inteligencia.
    lead: >-
      Cleoh captura lo que se publica en medios, redes y sitios públicos, lo
      convierte en inteligencia y lo pone donde tu equipo puede actuar.
    caption: Construido en Buenos Aires para equipos de comunicación.

  layers:
    eyebrow: Cómo funciona
    headline_lead: "Cuatro capas, una sola pregunta:"
    headline_highlight: ¿qué necesitás saber?
    lead: >-
      No alcanza con elegir fuentes. En Cleoh también configurás intereses, y
      el sistema trabaja para vos — no al revés.
    items:
      - number: "01"
        icon: antenna
        title: Captura
        tagline: Todo lo público, en un solo lugar.
        body: >-
          Cleoh está diseñado para escuchar donde se publica: medios, sitios
          web, y las redes donde hoy se construye sentido — X, Instagram,
          TikTok, YouTube, LinkedIn — más cualquier otra fuente pública que te
          importe.
      - number: "02"
        icon: layers
        title: Inteligencia
        tagline: De miles de publicaciones a un puñado de hechos.
        body: >-
          Extraemos el texto real, detectamos duplicados y casi-duplicados, y
          reunimos las apariciones de una misma historia. Lo que te llega no es
          un feed más largo: es lo que pasó, contado una vez, con todas sus
          fuentes.
      - number: "03"
        icon: send
        title: Distribución
        tagline: La información va hacia vos.
        body: >-
          Lo que importa llega a quien tiene que leerlo, en el momento en que
          sirve, sin que nadie tenga que abrir una herramienta más.
      - number: "04"
        icon: message
        title: Comunicación
        badge: Próxima capa
        tagline: Escuchar es la mitad. La otra es responder.
        body: >-
          La cuarta capa cierra el ciclo: del monitoreo a la acción, en el
          mismo lugar donde entendiste qué estaba pasando.

  audience:
    eyebrow: Para quién
    headline_lead: Para el área de comunicación
    headline_highlight: que tiene que saber antes.
    pro:
      title: Equipos de comunicación y agencias
      body: >-
        Cobertura, reputación, competencia y contexto en un solo lugar.
        Inteligencia sobre lo que se publica, y las herramientas para responder
        cuando hace falta.
    free:
      title: Y para cualquiera que quiera entender
      body: >-
        Debajo del motor profesional hay una capa gratuita: elegís tus fuentes
        y tus intereses, y recibís lo que importa. La misma captura, la misma
        inteligencia.

  closing:
    headline: Estamos construyendo Cleoh.
    body: >-
      Si trabajás en comunicación y algo de esto te resuena, queremos
      escucharte.
    contact_label: Escribinos

  footer:
    rights: Cleoh Media. Todos los derechos reservados.
    privacy: Privacidad

  not_found:
    title: Esta página no existe.
    home: Volver al inicio

  privacy:
    path: /privacidad/
    page_title: "Cleoh · Privacidad"
    meta_description: >-
      Qué datos guarda Cleoh, qué correos envía y cómo podés controlarlos.
    title: Privacidad y correo electrónico
    updated: "Última actualización: 2 de septiembre de 2026"
    intro: >-
      Cleoh Media ("Cleoh") es una plataforma de inteligencia de medios para
      equipos de comunicación. Esta página explica qué datos guardamos, qué
      correos enviamos y cómo podés controlarlos.
    contact_label: "Consultas sobre privacidad:"
    sections:
      - title: Qué datos guardamos
        items:
          - Tu dirección de correo electrónico, que usás para iniciar sesión.
          - Las fuentes y los intereses que configurás en la aplicación.
          - >-
            Registros técnicos mínimos, como fecha y hora de acceso, necesarios
            para operar y proteger el servicio.
      - title: Qué correos enviamos
        body: >-
          Solo enviamos correos transaccionales, es decir, mensajes que vos
          mismo iniciás desde la aplicación:
        items:
          - Un enlace para iniciar sesión, cuando lo pedís desde el formulario de acceso.
          - Una confirmación de cuenta, cuando te registrás.
          - Una confirmación de cambio de dirección, cuando la modificás desde tu cuenta.
        after: >-
          No enviamos boletines, promociones ni publicidad. No compramos,
          alquilamos ni importamos listas de direcciones, y solo escribimos a
          direcciones registradas en Cleoh. Cada mensaje incluye una nota para
          ignorarlo si no lo solicitaste.
      - title: Cómo dejar de recibir correos
        body: >-
          Como no hay envíos automáticos ni de marketing, no hay nada de lo que
          darse de baja: solo recibís un correo cuando lo pedís. Si un mensaje
          rebota o es marcado como no deseado, dejamos de enviar a esa
          dirección automáticamente. Si querés que eliminemos tu cuenta y tu
          dirección, escribinos y lo haremos.
      - title: Dónde se alojan los datos
        body: >-
          Los datos se alojan en Amazon Web Services, en la región de San Pablo
          (Brasil). Los correos se envían mediante Amazon SES desde el dominio
          cleohmedia.com, autenticado con SPF, DKIM y DMARC.
      - title: Con quién compartimos datos
        body: >-
          Con nadie. No vendemos ni cedemos datos personales a terceros. Solo
          usamos proveedores de infraestructura para alojar el servicio y
          enviar correo.
      - title: Cookies
        body: >-
          Este sitio no usa cookies ni servicios de terceros; solo guarda tu
          preferencia de idioma en tu navegador. La aplicación usa una cookie
          de sesión, necesaria para mantenerte conectado.

en:
  page_title: "Cleoh · Media intelligence"
  meta_description: >-
    Cleoh captures what gets published across media, social networks and public
    sites, turns it into intelligence, and distributes it to the communications
    teams that have to act.

  nav:
    aria_label: Main navigation
    layers: How it works
    audience: Who it's for
    contact: Contact

  hero:
    badge: Media intelligence platform
    headline_lead: Too much information.
    headline_highlight: Too little intelligence.
    lead: >-
      Cleoh captures what gets published across media, social networks and
      public sites, turns it into intelligence, and puts it where your team can
      act.
    caption: Built in Buenos Aires for communications teams.

  layers:
    eyebrow: How it works
    headline_lead: "Four layers, one question:"
    headline_highlight: what do you need to know?
    lead: >-
      Choosing sources isn't enough. In Cleoh you configure interests too, and
      the system works for you — not the other way around.
    items:
      - number: "01"
        icon: antenna
        title: Capture
        tagline: Everything public, in one place.
        body: >-
          Cleoh is designed to listen where publishing happens: media,
          websites, and the networks where meaning is built today — X,
          Instagram, TikTok, YouTube, LinkedIn — plus any other public source
          that matters to you.
      - number: "02"
        icon: layers
        title: Intelligence
        tagline: From thousands of publications to a handful of facts.
        body: >-
          We extract the actual text, detect duplicates and near-duplicates,
          and gather every appearance of the same story. What reaches you isn't
          a longer feed: it's what happened, told once, with all its sources.
      - number: "03"
        icon: send
        title: Distribution
        tagline: The information comes to you.
        body: >-
          What matters reaches the person who needs to read it, when it's
          useful, without anyone having to open one more tool.
      - number: "04"
        icon: message
        title: Communication
        badge: Next layer
        tagline: Listening is half of it. Answering is the other half.
        body: >-
          The fourth layer closes the loop: from monitoring to acting, in the
          same place where you understood what was going on.

  audience:
    eyebrow: Who it's for
    headline_lead: For the communications team
    headline_highlight: that has to know first.
    pro:
      title: Communications teams and agencies
      body: >-
        Coverage, reputation, competitors and context in one place.
        Intelligence about what's being published, and the tools to respond
        when you need to.
    free:
      title: And for anyone who wants to understand
      body: >-
        Underneath the professional engine there's a free layer: choose your
        sources and your interests, and get what matters. The same capture, the
        same intelligence.

  closing:
    headline: We're building Cleoh.
    body: >-
      If you work in communications and any of this resonates, we want to hear
      from you.
    contact_label: Write to us

  footer:
    rights: Cleoh Media. All rights reserved.
    privacy: Privacy

  privacy:
    path: /en/privacy/
    page_title: "Cleoh · Privacy"
    meta_description: >-
      What data Cleoh keeps, what email it sends, and how you control it.
    title: Privacy and email
    updated: "Last updated: September 2, 2026"
    intro: >-
      Cleoh Media ("Cleoh") is a media intelligence platform for communications
      teams. This page explains what data we keep, what email we send, and how
      you can control it.
    contact_label: "Privacy questions:"
    sections:
      - title: What data we keep
        items:
          - Your email address, which you use to sign in.
          - The sources and interests you configure in the application.
          - >-
            Minimal technical records, such as access date and time, needed to
            operate and protect the service.
      - title: What email we send
        body: >-
          We send transactional email only, meaning messages you yourself
          trigger from the application:
        items:
          - A sign-in link, when you request one from the sign-in form.
          - An account confirmation, when you register.
          - An address-change confirmation, when you change it from your account.
        after: >-
          We send no newsletters, promotions or advertising. We do not buy,
          rent or import address lists, and we only write to addresses
          registered in Cleoh. Every message includes a note to ignore it if
          you did not request it.
      - title: How to stop receiving email
        body: >-
          Since there is no automated or marketing email, there is nothing to
          unsubscribe from: you only receive a message when you ask for one. If
          a message bounces or is marked as unwanted, we automatically stop
          sending to that address. If you want your account and address
          deleted, write to us and we will do it.
      - title: Where data is hosted
        body: >-
          Data is hosted on Amazon Web Services in the São Paulo (Brazil)
          region. Email is sent through Amazon SES from the cleohmedia.com
          domain, authenticated with SPF, DKIM and DMARC.
      - title: Who we share data with
        body: >-
          No one. We do not sell or hand personal data to third parties. We
          only use infrastructure providers to host the service and send
          email.
      - title: Cookies
        body: >-
          This site uses no cookies and no third-party services; it only stores
          your language preference in your browser. The application uses a
          session cookie, required to keep you signed in.
